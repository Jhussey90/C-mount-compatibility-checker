<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT Vision Sensor & C-Mount Calculator</title>

<style>

:root{
    --gt-red:#BC2B2B;
    --gt-red-dark:#A62424;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:var(--gt-red);
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
    color:#333;
}

select{
    width:100%;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:15px;
    background:#fff;
}

button{
    margin-top:20px;
    width:100%;
    padding:14px;
    background:linear-gradient(
        180deg,
        var(--gt-red) 0%,
        var(--gt-red-dark) 100%
    );
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(188,43,43,0.35);
    transition:all 0.2s ease;
}

button:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 12px rgba(188,43,43,0.45);
    background:linear-gradient(
        180deg,
        #C93232 0%,
        #BC2B2B 100%
    );
}

button:active{
    transform:translateY(1px);
}

.results{
    margin-top:25px;
    background:#f7fafc;
    padding:20px;
    border-radius:10px;
}

.statusRow{
    display:flex;
    align-items:center;
    margin-bottom:12px;
}

.light{
    width:24px;
    height:24px;
    border-radius:50%;
    margin-right:10px;
    border:1px solid #ccc;
}

.resultLine{
    margin:8px 0;
    font-size:16px;
}

.recommend{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
    color:var(--gt-red);
}

svg{
    width:100%;
    max-width:650px;
    display:block;
    margin:auto;
}

@media(max-width:700px){

    .controls{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>GT Vision Sensor &amp; C-Mount Calculator</h1>

<p class="subtitle">
Select a camera sensor and C-mount adapter to evaluate image circle compatibility and vignetting risk.
</p>

<div class="controls">

    <div>

        <label>Camera Sensor</label>

        <select id="sensor">
            <option value="3.68,2.76">1/4"</option>
            <option value="4.8,3.6">1/3"</option>
            <option value="5.76,4.29">1/2.9"</option>
            <option value="6.4,4.8">1/2.5"</option>
            <option value="7.18,5.32">1/2"</option>
            <option value="8.8,6.6">2/3"</option>
            <option value="11.3,6.3" selected>1"</option>
            <option value="13.2,8.8">4/3"</option>
            <option value="17.3,13.0">APS-C</option>
        </select>

    </div>

    <div>

        <label>C-Mount Adapter</label>

        <select id="cmount">
            <option value="4.8">0.35x</option>
            <option value="6">0.45x</option>
            <option value="8">0.5x</option>
            <option value="11">0.63x</option>
            <option value="12.7" selected>0.7x</option>
            <option value="16">1.0x</option>
        </select>

    </div>

</div>

<button onclick="calculate()">
Calculate Compatibility
</button>

<div class="results">

    <div class="statusRow">

        <div id="light" class="light"></div>

        <div id="statusText">
            Excellent Coverage
        </div>

    </div>

    <div id="diag" class="resultLine"></div>

    <div id="coverage" class="resultLine"></div>

    <div id="recommend" class="recommend"></div>

</div>

<br>

<svg viewBox="0 0 500 500">

    <text
        id="svgStatus"
        x="250"
        y="35"
        text-anchor="middle"
        font-size="22"
        font-weight="bold">
        Coverage Status
    </text>

    <!-- Image Circle -->

    <circle
        id="imageCircle"
        cx="250"
        cy="270"
        r="180"
        fill="#d4edda"
        stroke="#28a745"
        stroke-width="4">
    </circle>

    <!-- Sensor Rectangle -->

    <rect
        id="sensorRect"
        x="175"
        y="210"
        width="150"
        height="100"
        fill="#28a74566"
        stroke="#28a745"
        stroke-width="3">
    </rect>

</svg>

</div>

<script>

const mounts = [
    {name:"0.35x",circle:4.8},
    {name:"0.45x",circle:6},
    {name:"0.5x",circle:8},
    {name:"0.63x",circle:11},
    {name:"0.7x",circle:12.7},
    {name:"1.0x",circle:16}
];

function recommendMount(diagonal){

    for(const mount of mounts){

        if(mount.circle >= diagonal){
            return mount.name;
        }
    }

    return "Larger than 1.0x Required";
}

function calculate(){

    const sensorValues =
        document.getElementById("sensor")
        .value.split(",");

    const sensorWidth =
        parseFloat(sensorValues[0]);

    const sensorHeight =
        parseFloat(sensorValues[1]);

    const imageCircle =
        parseFloat(
            document.getElementById("cmount").value
        );

    const sensorDiagonal =
        Math.sqrt(
            sensorWidth * sensorWidth +
            sensorHeight * sensorHeight
        );

    const coverage =
        (imageCircle / sensorDiagonal) * 100;

    let colour;
    let fill;
    let status;

    if(coverage >= 115){

        colour = "#28a745";
        fill = "#d4edda";
        status = "Excellent Coverage";

    }
    else if(coverage >= 100){

        colour = "#ffc107";
        fill = "#fff3cd";
        status = "Borderline Coverage";

    }
    else{

        colour = "#dc3545";
        fill = "#f8d7da";
        status = "Vignetting Risk";

    }

    document.getElementById("light")
        .style.backgroundColor = colour;

    document.getElementById("statusText")
        .textContent = status;

    document.getElementById("diag")
        .innerHTML =
        "<strong>Sensor Diagonal:</strong> " +
        sensorDiagonal.toFixed(2) +
        " mm";

    document.getElementById("coverage")
        .innerHTML =
        "<strong>Coverage:</strong> " +
        coverage.toFixed(1) +
        "%";

    document.getElementById("recommend")
        .innerHTML =
        "Recommended C-Mount: " +
        recommendMount(sensorDiagonal);

    document.getElementById("svgStatus")
        .textContent = status;

    document.getElementById("svgStatus")
        .setAttribute("fill", colour);

    const imageCircleSvg =
        document.getElementById("imageCircle");

    imageCircleSvg.setAttribute(
        "fill",
        fill
    );

    imageCircleSvg.setAttribute(
        "stroke",
        colour
    );

    const sensorRect =
        document.getElementById("sensorRect");

    sensorRect.setAttribute(
        "fill",
        colour + "66"
    );

    sensorRect.setAttribute(
        "stroke",
        colour
